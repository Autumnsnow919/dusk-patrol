<style>
:root {
  /* one visual world: last light over lake country. Full-bleed pixel stage, a single quiet strip of controls. */
  --ink: #1b1326;
  --dusk: #2c2244;
  --gold: #ffd884;
  --cream: #fff3dc;
  --ember: #e4502e;
  --teal: #48b2aa;
  --display: 'Pixelify Sans', 'IBM Plex Mono', ui-monospace, monospace;
  --body: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--cream); overflow: hidden; }
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(#4868a8, #7c8cbc 34%, #be96ac 58%, #eea486 78%, #ffe2a0); }
#stage canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; opacity: 0; transition: opacity .9s ease; }
#ui { pointer-events: none; }
body.ready #stage canvas { opacity: 1; }

.corner { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px); }

.hints { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .35em .9em;
  max-width: calc(100% - 32px); padding: .55em 1.1em; background: rgba(27, 19, 38, .80);
  font: 500 12.5px/1.3 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--cream);
  opacity: 0; transition: opacity .6s ease .3s; }
body.ready .hints { opacity: 1; }
body.ready .hints.fade { opacity: 0; transition-delay: 0s; pointer-events: none; }
.hints.at-bottom { bottom: 16px; }
.hints.at-top { top: 16px; }
.hints i { font-style: normal; opacity: .4; }
.hint { display: inline-flex; gap: .55em; white-space: nowrap; }
.hint b { font-weight: 500; color: var(--gold); }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips em { width: 4px; height: 10px; background: rgba(255, 243, 220, .22); }
.pips em.on { background: var(--ember); }
button.hint { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; border-bottom: 1px dashed rgba(255, 216, 132, .55); }
button.hint:hover b, button.hint:hover span { color: #fff; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.chip { position: absolute; top: 16px; right: 16px; font: 500 11.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase;
  color: var(--cream); background: rgba(27, 19, 38, .80); border: 0; padding: .75em 1em; cursor: pointer; opacity: 0; transition: opacity .6s ease .3s; }
body.ready .chip { opacity: 1; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.pad { position: absolute; bottom: 18px; display: none; font: 500 14px/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: var(--gold); border: 0; padding: 1.1em 1.2em; min-width: 7.5em; touch-action: none; cursor: pointer; }
#btn-view { left: 16px; }
#btn-boost { right: 16px; background: var(--ember); color: var(--cream); }
#btn-fire { right: 16px; bottom: 84px; background: var(--cream); }
body.touch .pad { display: block; }
body.touch .hints.at-bottom { bottom: auto; top: 56px; }

#title { position: absolute; left: 0; right: 0; top: 13%; text-align: center; pointer-events: none; transition: opacity 1.4s ease, transform 1.4s ease; }
#title.gone { opacity: 0; transform: translateY(-10px); }
#title h1 { margin: 0; font: 700 clamp(38px, 8.2vw, 104px)/.9 var(--display); letter-spacing: .02em; color: var(--cream); text-wrap: balance;
  text-shadow: 0 .055em 0 var(--ember), 0 .11em 0 var(--ink); }
#title p { margin: 1.4em 0 0; font: 500 clamp(11px, 1.25vw, 14px)/1.4 var(--body); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
#title p span { display: inline-block; background: var(--gold); padding: .35em .9em .35em 1.2em; }

#boot { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: min(260px, 60vw); text-align: center; transition: opacity .6s ease; }
#boot.done { opacity: 0; pointer-events: none; }
#boot-track { height: 8px; background: rgba(27, 19, 38, .55); }
#boot-bar { height: 100%; background: var(--cream); transform-origin: left center; transform: scaleX(0); }
#boot-msg { margin: .9em 0 0; font: 500 12px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
#boot.fail #boot-track { display: none; }
#boot.fail #boot-msg { background: var(--ink); color: var(--cream); padding: 1em; letter-spacing: .04em; text-transform: none; }

@media (max-width: 560px) { .hints { font-size: 11px; letter-spacing: .06em; } #title p { font-size: 10px; letter-spacing: .14em; } #title p span { padding: .35em .7em .35em .85em; } }
@media (max-width: 760px) { .hints.at-top { top: 56px; } }
@media (prefers-reduced-motion: reduce) { #stage canvas, #title, .hints, .chip, #boot { transition: none; } }
</style>

      <div id="kit-bay"><button type="button" id="edit-kit" aria-controls="outfit">L　配装</button><span id="kit-summary"></span></div>
      <small id="brief-mode"></small>
      <div id="launch-note" role="status"></div>
    </form>
  </section>
  <section id="lake-chart" class="flight-panel corner" hidden aria-label="湖区航图">
    <header><h3>湖区航图</h3><kbd>N 收起</kbd></header>

    <button id="next-site" type="button">K　下一航点</button><button id="chart-range" type="button">O　全域航图</button><p id="map-note"></p><div id="map-score"></div>
  </section>
  <section id="outfit" class="flight-panel corner" tabindex="-1" hidden aria-label="飞机配装">
    <header><h3>飞机配装</h3><output aria-live="polite"></output></header>

    <p id="kit-help"></p>
    <button class="kit-apply" type="button">Enter　应用配装</button><button class="kit-close" type="button">Esc　取消</button>
  </section>
  <aside id="damage-panel" hidden aria-label="机体损伤图"><strong>机体状态</strong><canvas id="damage-plan" width="80" height="74"></canvas><div id="part-values"></div><small id="service-note"></small></aside>
  <aside id="strip" class="corner" hidden><strong id="callsign"></strong><br><span id="telemetry"></span><br><span id="wingmen"></span><div id="stores"></div><div id="combat-state"></div><div id="waypoint"></div><div id="damage-message"></div><div id="activity"></div><div id="trait-state"></div><div id="perf"></div></aside>
</main>
<script src="terrain.js"></script>
<script>const {WORLD,genBand,bakeTex,genCloud,makeHeightSampler}=LakeTerrain;</script>
<script>
// ───────────────────────── shaders ─────────────────────────
const VS_QUAD = `#version 300 es
in vec2 aP; out vec2 vUV;
void main(){ vUV = aP*0.5+0.5; gl_Position = vec4(aP,0.0,1.0); }`;

// The whole landscape is ray-marched per low-res pixel: land, water, clouds, sky.
// Per-aircraft light-space tiles keep the silhouette stable as the camera moves.
const districtRows=Math.ceil(Lake.batches.length/4);
const AIR_SHADOW = `
uniform sampler2D uAircraftAtlas;
uniform vec3 uCasters[8],uLightRight,uLightUp,uCastLight;
uniform vec4 uCastBounds;
uniform int uCasterCount,uDistrictCount;
uniform vec4 uDistricts[4];uniform vec2 uDistrictTiles[4];uniform sampler2D uDistrictAtlas;
float landmarkShadow(vec3 p){
  float light=1.;
  for(int i=0;i<uDistrictCount;i++){
    vec3 rel=p-uDistricts[i].xyz;float size=uDistricts[i].w;
    vec2 q=.5+vec2(dot(rel,uLightRight),dot(rel,uLightUp))/(2.*size);
    if(any(lessThan(q,vec2(.002)))||any(greaterThan(q,vec2(.998))))continue;
    vec2 m=texture(uDistrictAtlas,(uDistrictTiles[i]+q)/vec2(4.,${districtRows.toFixed(1)})).rg;
    float z=.5+dot(rel,uCastLight)/(2.*size);
    light=min(light,1.-m.r*smoothstep(.006,.012,m.g/max(.001,m.r)-z));
  }
  return light;
}
float coverage(vec2 uv,float depth){
  vec2 m=texture(uAircraftAtlas,uv).rg;
  return m.r*smoothstep(-.014,.006,m.g/max(m.r,.001)-depth);
}
float planeShadow(vec3 point){
  if(uCasterCount==0)return 1.;
  vec3 lightPos=vec3(dot(point,uLightRight),dot(point,uLightUp),dot(point,uCastLight));
  if(any(lessThan(lightPos.xy,uCastBounds.xy))||any(greaterThan(lightPos.xy,uCastBounds.zw)))return 1.;
  float shade=0.;
  for(int i=0;i<uCasterCount;i++){
    vec3 rel=lightPos-uCasters[i];
    float along=rel.z;
    if(along>24. || along< -990.)continue;
    vec2 q=rel.xy/52.+.5;
    if(any(lessThan(q,vec2(.04)))||any(greaterThan(q,vec2(.96))))continue;
    vec2 atlas=(q+vec2(i%4,i/4))/vec2(4.,2.);
    vec2 d=vec2(1./512.,1./256.)*clamp(.65-along*.012,.65,5.);
    float z=.5+along/52.;
    float mask=.36*coverage(atlas,z)+.16*(coverage(atlas+d,z)+coverage(atlas-d,z)+
        coverage(atlas+vec2(d.x,-d.y),z)+coverage(atlas+vec2(-d.x,d.y),z));
    shade=max(shade,mask*(1.-smoothstep(180.,990.,-along)));
  }
  return 1.-shade;
}`;
const FS_SCENE = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uTerrain, uCloud;
uniform vec3 uCam; uniform mat3 uRot; uniform vec2 uRes; uniform float uTanF, uTime;
uniform vec3 uSunL, uSunV, uSunP;
${AIR_SHADOW}
uniform vec2 uCloudOff; uniform vec2 uNF; uniform float uCeil;
out vec4 o;

const float L = ${WORLD.L.toFixed(1)}, LC = ${WORLD.LC.toFixed(1)}, HMIN = -96.0, HSPAN = 512.0, HMAX = 416.0;
const float CB = 465.0, CT = 80.0, C0 = 0.52;
const vec2 E1 = vec2(0.7474, 0.6644), E2 = vec2(-0.6644, 0.7474);
const float FAR = 9000.0;

#define C(r,g,b) (vec3(r,g,b)/255.0)

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }
float bayer4(vec2 fc){ ivec2 i = ivec2(fc) & 3;
  const int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[i.x + i.y*4]) + 0.5) / 16.0; }

vec2 tuv(vec2 xz){ return vec2(dot(xz,E1), dot(xz,E2)) / L; }
float dec(vec4 s){ return (s.r*65280.0 + s.g*255.0) / 65535.0 * HSPAN + HMIN; }
float hgt(vec2 xz, float lod){ return dec(textureLod(uTerrain, tuv(xz), lod)); }

float cfield(vec2 xz, float lod){ return textureLod(uCloud, vec2(dot(xz,E1), dot(xz,E2)) / LC + uCloudOff, lod).r; }
float cloudTop(float n){ float f = (n - C0) / (1.0 - C0);
  return CB + CT * (f > 0.0 ? sqrt(f) * (0.42 + 0.58*f) : f * 3.0); }

vec3 pick4(vec3 a, vec3 b, vec3 c, vec3 d, float l, float dth){
  float i = clamp(floor(clamp(l, 0.0, 0.999) * 4.0 + (dth - 0.5) * 0.6), 0.0, 3.0);
  return i < 0.5 ? a : i < 1.5 ? b : i < 2.5 ? c : d; }

// ── sky ──
vec3 skyGrad(float y){
  vec3 c = mix(C(255,226,160), C(252,200,134), smoothstep(-0.02, 0.05, y));
  c = mix(c, C(238,164,134), smoothstep(0.04, 0.16, y));
  c = mix(c, C(190,150,172), smoothstep(0.14, 0.32, y));
  c = mix(c, C(124,140,188), smoothstep(0.28, 0.58, y));
  c = mix(c, C(72,104,168), smoothstep(0.5, 1.0, y));
  return c; }
vec3 skyBase(vec3 rd){
  vec3 c = skyGrad(rd.y);
  float az = dot(normalize(rd.xz + 1e-5), normalize(uSunV.xz)) * 0.5 + 0.5;
  float low = 1.0 - smoothstep(0.0, 0.45, rd.y);
  c = mix(c, c * vec3(1.06, 1.03, 0.92) + vec3(0.07, 0.05, 0.0), pow(az, 4.0) * low);
  c = mix(c, mix(c, C(150,140,190), 0.55), pow(1.0 - az, 1.6) * low);
  return c; }

float cloudShadow(vec3 p){
  vec2 q = p.xz + uSunP.xz / uSunP.y * (CB + 22.0 - p.y);
  float n = cfield(q, 0.5);
  return 1.0 - smoothstep(C0 - 0.015, C0 + 0.05, n); }


uniform sampler2D uSurface;
float surfaceDistance(vec3 rd,out bool water){
  vec3 packedDepth=texelFetch(uSurface,ivec2(gl_FragCoord.xy),0).rgb;
  float z=dot(packedDepth,vec3(65536.,256.,1.))*(255./256.);
  float land=z>0.?z/max(.001,dot(rd,uRot[2])):1e10;
  float lake=rd.y<-.00001?-uCam.y/rd.y:1e10;
  water=lake>0. && lake<land;
  float t=water?lake:land;return t>0.&&t<FAR?t:-1.;
}
float traceCloud(vec3 ro,vec3 rd,float lim,out bool under){
  // ── clouds ──
  float tC = -1.0; under = false;
  {

    float ya = CB - 5.0, yb = min(CB + CT + 2.0, uCeil), t0 = 0.0, t1 = lim;
    bool ok = true;
    if (abs(rd.y) < 1e-4) { ok = ro.y > ya && ro.y < yb; }
    else { float a = (ya - ro.y) / rd.y, b = (yb - ro.y) / rd.y; t0 = max(min(a, b), 0.0); t1 = min(max(a, b), lim); }
    if (ok && t1 > t0 && yb > ya) {
      t1 = min(t1, t0 + 5600.0);
      float tt = t0 + 0.3, tp = tt;
      for (int i = 0; i < 64; i++) {
        if (tt > t1) break;
        vec3 p = ro + rd * tt;
        float lod = clamp(log2(tt / 600.0), 0.0, 4.0);
        float top = cloudTop(cfield(p.xz, lod));
        float d = p.y - top;
        if (d < 0.0 && top > CB) {
          float a = tp, b = tt;
          for (int k = 0; k < 5; k++) { float m = 0.5 * (a + b); vec3 q = ro + rd * m; float tq = cloudTop(cfield(q.xz, lod)); if (q.y < tq && tq > CB) b = m; else a = m; }
          tC = b; under = (ro + rd * b).y < CB + 1.5 && rd.y > 0.0; break;
        }
        tp = tt;
        tt += clamp(abs(d) * 0.4, 2.0 + tt * 0.012, 22.0 + tt * 0.03);
      }
    }
  }

  return tC;
}
void main(){
  vec2 fc = gl_FragCoord.xy;
  float dth = bayer4(fc);
  vec2 ndc = (fc / uRes) * 2.0 - 1.0;
  vec3 rd = normalize(uRot * vec3(ndc.x * uTanF * uRes.x / uRes.y, ndc.y * uTanF, 1.0));
  vec3 ro = uCam;

  bool water=false,under=false;
  float tHit=surfaceDistance(rd,water);
  float tC=traceCloud(ro,rd,tHit>0.?tHit:FAR,under);
  vec3 col; float tOut = FAR * 4.0; float fogT = -1.0;
  vec3 horiz = skyBase(normalize(vec3(rd.x, 0.012, rd.z)));

  if (tC > 0.0) {
    // ── cloud surface ──
    vec3 p = ro + rd * tC; tOut = tC; fogT = tC;
    float lod = clamp(log2(tC / 600.0), 0.0, 4.0), e = 7.0 + tC * 0.004;
    float n0 = cfield(p.xz, lod);
    float tx = cloudTop(cfield(p.xz + vec2(e, 0), lod)) - cloudTop(cfield(p.xz - vec2(e, 0), lod));
    float tz = cloudTop(cfield(p.xz + vec2(0, e), lod)) - cloudTop(cfield(p.xz - vec2(0, e), lod));
    vec3 n = normalize(vec3(-tx, 2.0 * e, -tz));
    float kh = clamp((p.y - CB) / CT, 0.0, 1.0);
    float l = 0.40 + 0.42 * max(dot(n, uSunL), 0.0) + 0.30 * kh;
    l -= step(fract(kh * 5.0 + 0.45), 0.14) * 0.085;               // stacked-contour steps
    if (under) l = 0.12 + 0.1 * n0;
    l *= mix(1.0, planeShadow(p), 0.5);
    col = pick4(C(150,120,168), C(228,168,168), C(255,228,200), C(255,250,238), l, dth);
  } else if (tHit > 0.0) {
    vec3 p = ro + rd * tHit; tOut = tHit; fogT = tHit;
    float lodS = clamp(log2(tHit / 700.0), 0.0, 5.0);
    vec4 s = textureLod(uTerrain, tuv(p.xz), lodS);
    float h = dec(s), bake = s.b, biome = s.a;
    float lit = (1.0 - smoothstep(0.25, 0.75, bake + (dth - 0.5) * 0.3)) * cloudShadow(p);
    float psh = min(planeShadow(p),landmarkShadow(p));
    float fade = smoothstep(2200.0, 500.0, tHit);
    if (water) {
      // ── water ──
      float depth = -h;
      float n1 = vnoise(p.xz * 0.018 + uTime * 0.03), n2 = vnoise(p.xz * 0.09 - uTime * 0.06);
      float d = depth + (n1 - 0.5) * 7.0 + (n2 - 0.5) * 2.5 * fade + (dth - 0.5) * 1.6;
      col = d < 2.6 ? C(150,222,190) : d < 7.5 ? C(72,178,170) : d < 19.0 ? C(38,128,152) : d < 44.0 ? C(30,86,134) : C(24,54,104);
      // sky on the water at low angles
      float fres = pow(1.0 - max(-rd.y, 0.0), 4.0);
      vec3 rf = reflect(rd, normalize(vec3((n2 - 0.5) * 0.10, 1.0, (n1 - 0.5) * 0.10)));
      col = mix(col, skyBase(rf), fres * 0.82);
      // shade
      col = mix(col * vec3(0.56, 0.60, 0.86), col, lit);
      col = mix(col * vec3(0.42, 0.44, 0.66), col, psh);
      // foam along the shore
      float foam = 0.9 + 0.7 * sin(uTime * 1.1 + n1 * 14.0);
      if (depth < foam * fade + 0.4 && hash12(floor(p.xz / 2.0) + floor(uTime * 2.0)) > 0.25) col = mix(C(255,244,220), col, 0.12 + 0.3 * (1.0 - lit));
      // glints: short dashes lying along the wind
      vec2 w = vec2(dot(p.xz, vec2(0.94, 0.34)), dot(p.xz, vec2(-0.34, 0.94))) / vec2(7.0, 2.4);
      vec2 cell = floor(w), fw = fract(w);
      float rnd = hash12(cell);
      float sunPath = pow(max(dot(rf, uSunV), 0.0), 60.0);
      float thr = 0.982 - sunPath * 0.6 + smoothstep(600.0, 2600.0, tHit) * 0.02 * (1.0 - min(sunPath * 4.0, 1.0)) + (1.0 - smoothstep(40.0, 260.0, tHit)) * 0.013;
      float tw = hash12(cell + floor(uTime * 1.7 + rnd * 9.0) * 13.0);
      if (tw > thr && tHit > 40.0 && abs(fw.y - 0.5) < 0.34 && (fw.x > 0.15 || sunPath > 0.2)) col = mix(col, C(255,250,228), lit * 0.75 + 0.25);
    } else {
      // ── land ──
      float e = 5.0 + tHit * 0.004;
      vec3 n = normalize(vec3(hgt(p.xz - vec2(e, 0), lodS) - hgt(p.xz + vec2(e, 0), lodS), 2.0 * e, hgt(p.xz - vec2(0, e), lodS) - hgt(p.xz + vec2(0, e), lodS)));
      vec2 cq = p.xz / 4.4 + (vec2(vnoise(p.xz * 0.085), vnoise(p.xz * 0.085 + 31.7)) - 0.5) * 2.2;   // crowns, nudged off the grid
      vec2 cell = floor(cq), cf = fract(cq);
      float r1 = hash12(cell), r2 = hash12(cell + 91.7);
      float nz = vnoise(p.xz * 0.011), nz2 = vnoise(p.xz * 0.045), nz3 = vnoise(p.xz * 0.0045 + 40.0);
      float slope = 1.0 - n.y;
      float hh = h + (nz2 - 0.5) * 12.0 + (r1 - 0.5) * 3.0 * fade;
      float l = 0.13 + 0.25 * n.y + 0.66 * max(dot(n, uSunL), 0.0) * lit;
      l += (fract(hh / 15.0) - 0.5) * 0.07;                         // terraces
      l *= mix(0.5, 1.0, psh);
      float crown = ((1.0 - cf.x) + (1.0 - cf.y) - 1.0) * 0.30 + (r1 - 0.5) * 0.22;   // lit north-west, dark south-east
      float forest = biome * 0.75 + nz * 0.5;
      if (hh > 224.0 + slope * 70.0) {
        col = pick4(C(124,122,178), C(196,180,208), C(244,222,210), C(255,247,232), l + 0.08, dth);
      } else if (slope > 0.34 || hh > 192.0) {
        l += (r1 - 0.5) * 0.10 * fade - step(fract(hh / 10.0), 0.22) * 0.07;
        col = pick4(C(62,52,88), C(112,96,120), C(166,148,138), C(214,196,168), l, dth);
      } else if (hh < 4.5) {
        col = pick4(C(126,100,112), C(186,154,112), C(228,200,140), C(248,226,170), l + 0.12, dth);
      } else if (forest > 0.52) {
        l += crown * fade;
        float sa = vnoise(p.xz * 0.0052 + 17.0) + (r2 - 0.5) * 0.16, sb = vnoise(p.xz * 0.0105 + 71.0) + (r1 - 0.5) * 0.16;
        if (hh > 104.0 + nz * 46.0 || (nz3 > 0.66 && hh > 22.0) || r2 > 0.955) {
          col = pick4(C(22,42,60), C(30,70,66), C(44,104,78), C(96,152,88), l, dth);
        } else if (sa > 0.60) col = pick4(C(78,58,56), C(170,122,42), C(230,176,48), C(252,216,96), l, dth);
        else if (sb > 0.56)   col = pick4(C(64,30,56), C(132,40,50), C(198,62,56), C(240,124,74), l, dth);
        else                  col = pick4(C(74,34,58), C(156,62,38), C(222,112,40), C(248,168,60), l, dth);
      } else if (hh < 16.0 && biome > 0.47) {
        l += (r1 - 0.5) * 0.08 * fade;
        col = pick4(C(40,66,72), C(78,116,82), C(134,166,88), C(192,208,116), l, dth);    // water meadows
      } else {
        l += (r1 - 0.5) * 0.08 * fade + step(0.5, fract((p.x * 0.6 + p.z * 0.8) / 9.0 + nz * 3.0)) * 0.035 * fade;
        col = pick4(C(92,84,88), C(168,146,84), C(220,194,110), C(246,228,150), l, dth);
      }
    }
  } else {
    // ── sky ──
    col = skyBase(rd);
    // high streaks catching the last light
    if (rd.y > 0.015) {
      vec2 sp = rd.xz / (rd.y + 0.12) * vec2(1.0, 3.2);
      float st = vnoise(sp * 0.9 + vec2(uTime * 0.004, 3.0)) * 0.6 + vnoise(sp * 2.7 + 9.0) * 0.4;
      float cov = smoothstep(0.56, 0.74, st + (dth - 0.5) * 0.08) * smoothstep(0.015, 0.09, rd.y) * (1.0 - smoothstep(0.35, 0.8, rd.y));
      col = mix(col, mix(C(255,214,170), C(232,150,150), smoothstep(0.1, 0.5, rd.y)), cov * 0.8);
    }
    float sd = dot(rd, uSunV);
    col = mix(col, C(255,232,170), smoothstep(0.972, 0.9985, sd) * 0.55);
    if (sd > 0.9965) col = C(255,226,150);
    if (sd > 0.99815) col = C(255,250,226);
  }

  // ── aerial haze ──
  if (fogT > 0.0) {
    float f = 1.0 - exp(-max(fogT - 520.0, 0.0) / 3300.0);
    f = clamp(f + smoothstep(FAR * 0.72, FAR, fogT), 0.0, 1.0);
    f = floor(f * 14.0 + dth) / 14.0;
    col = mix(col, horiz, clamp(f, 0.0, 1.0));
  }
  // posterise to a restrained ramp
  col = floor(col * 28.0 + dth) / 28.0;

  float zc = max(tOut * dot(rd, uRot[2]), uNF.x);
  float zn = (uNF.y + uNF.x) / (uNF.y - uNF.x) - (2.0 * uNF.y * uNF.x) / (uNF.y - uNF.x) / zc;
  gl_FragDepth = clamp(zn * 0.5 + 0.5, 0.0, 1.0);
  o = vec4(col, 0.0);
}`;

const VS_MESH = `#version 300 es

      if(part==18.){

  $('btn-sound').addEventListener('click', e => { toggleSound(); e.currentTarget.blur(); });

  // ── loop ──
  let last=0,overBudget=0,headroom=0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!worldReady || document.hidden) return;

    const raw = (now - last) / 1000; last = now;
    const dt = clamp(raw, 0, .12);
    update(dt); render();
    if(flying) {
      frameMs+=.06*(clamp(raw*1000,1,250)-frameMs);
      room.sync(body,now,wireControls,keys.has('KeyJ'),keys.has('KeyX'));showReadout(now);audio.update(body,S,cam,room,keys.has('KeyZ'),keys.has('KeyJ')&&room.weapon==='gun');
      if(onlineSortie&&!room.token){park();$('launch-note').textContent='房间连接已过期，请重新加入。';}
      else scope.draw(now,room,body,cam,Lake.sites[chart.selected]);
    }
    if(quality!==0 || window.__noAdapt || raw>.25)return;
    overBudget=raw>.022?overBudget+dt:Math.max(0,overBudget-dt*.5);
    headroom=raw<.0183?headroom+dt:Math.max(0,headroom-dt*2);
    if(overBudget>(scaleBias===2?1.55:.55) && IH>=170 && scaleBias<3){scaleBias++;overBudget=headroom=0;resize();}
    else if(headroom>12 && scaleBias>0){scaleBias--;overBudget=headroom=0;resize();}
  }

  function start() {
    resize(); updateHints();
    loadLakeWorld(generateWorld,p => { $('boot-bar').style.transform = 'scaleX(' + p.toFixed(3) + ')'; }).then(w => {
      heightField = w.height; groundAt = makeHeightSampler(w.height);
      uploadWorld(w.tex, w.cloud);chart.bake(groundAt);
      worldReady = true; last = performance.now();
      update(0.016);
      $('boot').classList.add('done'); document.body.classList.add('ready');
      $('launch').disabled=false; $('launch').textContent='进入空域';
    });
    requestAnimationFrame(frame);
  }

  start();
})();

</script>
</body>
</html>
